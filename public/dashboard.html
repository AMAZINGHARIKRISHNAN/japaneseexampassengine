<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Dashboard — 日本語 Pass Engine</title>
  <style>
    :root {
      --bg:        #12131a;
      --bg2:       #0d0e14;
      --surface:   #1b1d28;
      --surface2:  #222533;
      --line:      #2e3242;
      --ink:       #ece8df;
      --ink-dim:   #a6a8b6;
      --ink-faint: #6f7283;
      --jade:      #5fc28a;
      --jade-dim:  #2c6347;
      --jade-bg:   #182b1f;
      --vermilion: #e2553f;
      --verm-dim:  #5c2a23;
      --verm-bg:   #2b1418;
      --indigo:    #7c8cf0;
      --indigo-dim:#363c6e;
      --indigo-bg: #1a1e35;
      --radius:    14px;
      --jp: "Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic","Meiryo","Noto Sans JP",sans-serif;
      --ui: system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: var(--ui);
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      background-image: radial-gradient(1100px 500px at 80% -10%, #1a1d2e 0%, transparent 60%);
    }
    ::-webkit-scrollbar { width: 6px; height: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: var(--line); border-radius: 3px; }

    .header {
      position: sticky; top: 0; z-index: 200;
      height: 56px;
      background: #0d0e14ee;
      border-bottom: 1px solid var(--line);
      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
      display: flex; align-items: center; gap: 16px; padding: 0 24px;
    }
    .hdr-brand { display: flex; align-items: baseline; gap: 10px; flex: 1; }
    .hdr-kanji { font-family: var(--jp); font-size: 22px; font-weight: 900; color: var(--vermilion); letter-spacing: 1px; }
    .hdr-title { font-size: 12px; font-weight: 700; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 2px; }
    .hdr-user  { font-size: 13px; color: var(--ink-dim); }

    .pill {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 6px 13px; border-radius: 20px;
      font-family: var(--ui); font-size: 12px; font-weight: 600;
      letter-spacing: .3px; cursor: pointer; border: 1px solid var(--line);
      background: transparent; color: var(--ink-dim);
      transition: background .15s, border-color .15s, color .15s;
    }
    .pill:hover { background: var(--surface); color: var(--ink); }
    .pill.danger { background: var(--verm-bg); border-color: var(--verm-dim); color: #f08080; }
    .pill.danger:hover { background: #3a1a1e; }

    .page { max-width: 980px; margin: 0 auto; padding: 32px 24px 80px; }
    .welcome { font-size: 22px; font-weight: 800; margin-bottom: 6px; }
    .welcome-sub { font-size: 13px; color: var(--ink-faint); margin-bottom: 30px; }

    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(360px, 1fr)); gap: 18px; }
    .course-card {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: var(--radius); padding: 24px 26px; position: relative;
      overflow: hidden;
    }
    .course-card.n3 { border-left: 3px solid var(--vermilion); }
    .course-card.n4 { border-left: 3px solid var(--indigo); }
    .cc-hdr { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .cc-title { font-family: var(--jp); font-size: 26px; font-weight: 900; }
    .course-card.n3 .cc-title { color: var(--vermilion); }
    .course-card.n4 .cc-title { color: var(--indigo); }
    .cc-tag {
      font-size: 10px; font-weight: 800; text-transform: uppercase;
      letter-spacing: 1.5px; padding: 3px 9px; border-radius: 5px;
    }
    .course-card.n3 .cc-tag { background: var(--verm-bg);   color: var(--vermilion); border: 1px solid var(--verm-dim); }
    .course-card.n4 .cc-tag { background: var(--indigo-bg); color: var(--indigo);    border: 1px solid var(--indigo-dim); }

    .cc-stats { display: flex; gap: 22px; margin-bottom: 20px; }
    .cc-stat .v { font-size: 22px; font-weight: 800; line-height: 1; }
    .cc-stat .l { font-size: 10px; color: var(--ink-faint); text-transform: uppercase; letter-spacing: 1.2px; margin-top: 5px; }

    .cc-links { display: flex; flex-wrap: wrap; gap: 8px; }
    .cc-link {
      flex: 1; min-width: 120px; text-align: center;
      padding: 10px 12px; border-radius: 9px;
      background: var(--bg2); border: 1px solid var(--line);
      color: var(--ink-dim); font-size: 13px; font-weight: 600;
      text-decoration: none; transition: background .15s, color .15s, border-color .15s;
    }
    .cc-link:hover { background: var(--surface2); color: var(--ink); }
    .cc-link.primary { background: var(--indigo-bg); border-color: var(--indigo-dim); color: var(--indigo); }
    .course-card.n3 .cc-link.primary { background: var(--verm-bg); border-color: var(--verm-dim); color: var(--vermilion); }
    .cc-link.primary:hover { filter: brightness(1.15); }

  
/* ── Build stamp ── */
[data-version-badge]{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:6px;font-size:11px;color:var(--ink-faint);line-height:1.6;opacity:0;transition:opacity .3s}
[data-version-badge][data-ready]{opacity:1}
[data-version-badge] .vb-ver{font-weight:700;color:var(--ink-dim);letter-spacing:.4px}
[data-version-badge] .vb-sep{opacity:.5}
[data-version-badge] .vb-note{flex-basis:100%;text-align:center;font-size:10.5px;opacity:.85}
</style>
</head>
<body>

<header class="header">
  <div class="hdr-brand">
    <span class="hdr-kanji">日本語</span>
    <span class="hdr-title">Dashboard</span>
  </div>
  <span class="hdr-user" id="hdrUser"></span>
  <button class="pill danger" id="logoutBtn">Sign Out</button>
</header>

<div class="page">
  <div class="welcome" id="welcomeMsg">Welcome back</div>
  <div class="welcome-sub">Pick up where you left off.</div>
  <div class="cards" id="cards"></div>
  <div data-version-badge aria-live="polite"></div>
</div>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/11.9.0/firebase-app.js";
import { getFirestore, doc, getDoc, collection, query, orderBy, limit, getDocs }
  from "https://www.gstatic.com/firebasejs/11.9.0/firebase-firestore.js";
import { getAuth, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/11.9.0/firebase-auth.js";

const firebaseConfig = {
  apiKey:            "AIzaSyCDfc2n8sJfesrIwbWluTmjTnTsl_x46SQ",
  authDomain:        "japanesen3passengine.firebaseapp.com",
  projectId:         "japanesen3passengine",
  storageBucket:     "japanesen3passengine.firebasestorage.app",
  messagingSenderId: "409024055518",
  appId:             "1:409024055518:web:c1e74cb1cf64e50fc25a4f",
  measurementId:     "G-5KH5JW9JX3"
};
const app  = initializeApp(firebaseConfig);
const db   = getFirestore(app);
const auth = getAuth(app);

// Resolves with the Firebase Auth user (or null) once the persisted session
// has been restored — Firestore reads are blocked by rules until then.
const authReady = new Promise(resolve => {
  const stop = onAuthStateChanged(auth, u => { stop(); resolve(u); });
});

// ─── Auth guard ────────────────────────────────────────────────────────────
// Admins don't need a student dashboard; no session at all → back to login.
let session = null;
try {
  const admin = JSON.parse(sessionStorage.getItem("n3_admin_verified") ?? "null");
  if (admin?.verified === true) {
    window.location.replace("admin.html");
    throw new Error("redirecting");
  }
  session = JSON.parse(sessionStorage.getItem("n3_user_session") ?? "null");
  if (session?.verified !== true) throw new Error("no session");
} catch {
  if (!session || session.verified !== true) window.location.replace("login.html");
}

const displayName = session?.fullName || session?.username || "";
document.getElementById("hdrUser").textContent = session?.username ? `@${session.username}` : "";
document.getElementById("welcomeMsg").textContent = displayName ? `Welcome back, ${displayName}` : "Welcome back";

document.getElementById("logoutBtn").addEventListener("click", async () => {
  sessionStorage.removeItem("n3_user_session");
  try { await signOut(auth); } catch { /* ignore */ }
  window.location.replace("login.html");
});

// ─── Local progress: count completed items across an engine's state blob ───
// Counts every section the engines actually persist. `parts` was missing here,
// so the tile under-reported for everyone; N4 has no `kanji` section at all,
// which is why this iterates the state's own keys instead of a fixed list.
// `days` (an N4 number) and any future scalar are skipped by the type check.
function countCompleted(localStorageKey) {
  try {
    const state = JSON.parse(localStorage.getItem(localStorageKey) || "{}");
    let total = 0;
    for (const value of Object.values(state)) {
      if (value && typeof value === "object" && !Array.isArray(value)) {
        total += Object.values(value).filter(Boolean).length;
      }
    }
    return total;
  } catch {
    return 0;
  }
}

// ─── Course card definitions ────────────────────────────────────────────────
const COURSES = {
  n3: {
    label: "N3",
    localKey: "n3engine.v1",
    links: [
      { href: "n3-pass-engine.html", text: "Study", primary: true },
      { href: "n3-boost.html",       text: "Boost" },
      { href: "n3-mock-test.html",   text: "Mock Test" },
      { href: "n3-stats.html",       text: "Stats" },
    ],
    latestScore: async (username) => {
      const snap = await getDoc(doc(db, "mock_scores", username));
      if (!snap.exists()) return null;
      const scores = snap.data().scores ?? [];
      if (!scores.length) return null;
      return scores[scores.length - 1];
    },
  },
  n4: {
    label: "N4",
    localKey: "n4engine.v1",
    links: [
      { href: "n4-pass-engine.html", text: "Study", primary: true },
      { href: "n4-boost.html",       text: "Boost" },
      { href: "n4-mock-test.html",   text: "Mock Test" },
      { href: "n4-stats.html",       text: "Stats" },
    ],
    latestScore: async (username) => {
      const q = query(
        collection(db, "mock_scores_n4", username, "attempts"),
        orderBy("ts", "desc"), limit(1)
      );
      const snap = await getDocs(q);
      if (snap.empty) return null;
      return snap.docs[0].data();
    },
  },
};

function renderCard(courseKey) {
  const c = COURSES[courseKey];
  const completed = countCompleted(c.localKey);

  const card = document.createElement("div");
  card.className = `course-card ${courseKey}`;
  card.innerHTML = `
    <div class="cc-hdr">
      <span class="cc-title">${c.label}</span>
      <span class="cc-tag">${c.label} · JLPT</span>
    </div>
    <div class="cc-stats">
      <div class="cc-stat">
        <div class="v">${completed}</div>
        <div class="l">Items reviewed</div>
      </div>
      <div class="cc-stat">
        <div class="v" id="score-${courseKey}">—</div>
        <div class="l">Latest mock score</div>
      </div>
    </div>
    <div class="cc-links">
      ${c.links.map(l => `<a class="cc-link ${l.primary ? "primary" : ""}" href="${l.href}">${l.text}</a>`).join("")}
    </div>
  `;
  return card;
}

// Every account gets every course in the catalog — no per-course grant.
// Each card's stats reflect whatever that student has actually done locally.
const cardsEl = document.getElementById("cards");
const allCourseKeys = Object.keys(COURSES);

for (const courseKey of allCourseKeys) {
  cardsEl.appendChild(renderCard(courseKey));
}

// Best-effort remote score fetch — never blocks the initial render.
// Waits for the Firebase Auth session; without it the rules deny the reads.
if (session?.username) {
  authReady.then(user => {
    if (!user) return;
    for (const courseKey of allCourseKeys) {
      COURSES[courseKey].latestScore(session.username)
      .then(result => {
        if (!result) return;
        const el = document.getElementById(`score-${courseKey}`);
        if (!el) return;
        el.textContent = result.total != null
          ? `${result.total} ${result.pass ? "✓" : ""}`
          : "✓";
      })
      .catch(e => console.warn(`[dashboard] mock score fetch failed for ${courseKey}`, e));
    }
  });
}
</script>
<script src="version-badge.js" defer></script>
</body>
</html>
