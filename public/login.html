<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Sign In — 日本語</title>
  <style>
    :root {
      color-scheme: dark;
      --bg:        #12131a;
      --bg2:       #0d0e14;
      --surface:   #1b1d28;
      --surface2:  #222533;
      --line:      #2e3242;
      --ink:       #ece8df;
      --ink-dim:   #a6a8b6;
      --ink-faint: #6f7283;
      --jade:      #5fc28a;
      --jade-dim:  #2c6347;
      --jade-bg:   #182b1f;
      --vermilion: #e2553f;
      --verm-dim:  #5c2a23;
      --verm-bg:   #2b1418;
      --gold:      #d8af52;
      --gold-bg:   #261f0e;
      --indigo:    #7c8cf0;
      --indigo-dim:#363c6e;
      --indigo-bg: #1a1e35;
      --radius:    14px;
      --jp: "Hiragino Kaku Gothic ProN","Hiragino Sans","Yu Gothic","YuGothic","Meiryo","Noto Sans JP",sans-serif;
      --ui: system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    }

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: var(--ui);
      background: var(--bg);
      color: var(--ink);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-image:
        radial-gradient(900px 500px at 70% -10%, #1a1d2e 0%, transparent 60%),
        radial-gradient(600px 400px at 20% 110%, #12201a 0%, transparent 55%);
    }

    /* ── Card ── */
    .card {
      width: min(420px, calc(100vw - 32px));
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      padding: 34px 32px 30px;
      box-shadow: 0 24px 60px #00000055, 0 0 0 1px #ffffff08 inset;
    }

    /* ── Logo ── */
    .logo { text-align: center; margin-bottom: 24px; }
    .logo .kanji {
      font-family: var(--jp);
      font-size: 44px;
      font-weight: 900;
      color: var(--vermilion);
      letter-spacing: 4px;
      line-height: 1;
      /* Hidden admin entrance lives here — keep repeated taps from selecting
         the text or flashing a mobile tap highlight, which would advertise it. */
      cursor: default;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .logo .sub {
      font-size: 11px;
      color: var(--ink-faint);
      text-transform: uppercase;
      letter-spacing: 2.5px;
      margin-top: 7px;
    }

    /* ── View toggle: Sign In / Register (segmented control) ── */
    .view-toggle {
      display: flex;
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: 10px;
      padding: 3px;
      margin-bottom: 22px;
      position: relative;
    }
    body.view-admin .view-toggle { display: none; }
    .view-btn {
      flex: 1;
      padding: 9px 10px;
      border: none;
      border-radius: 7px;
      background: transparent;
      color: var(--ink-faint);
      font-family: var(--ui);
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: color .2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      position: relative;
      z-index: 1;
    }
    .view-btn.active { color: var(--indigo); }

    /* sliding highlight pill */
    .view-toggle::before {
      content: "";
      position: absolute;
      top: 3px;
      left: 3px;
      width: calc(50% - 3px);
      height: calc(100% - 6px);
      background: var(--indigo-bg);
      border-radius: 7px;
      box-shadow: 0 1px 5px #00000050;
      transition: transform .22s cubic-bezier(.4,0,.2,1);
    }
    body.view-register .view-toggle::before { transform: translateX(100%); }

    /* ── Admin banner ── */
    .admin-banner {
      display: none;
      align-items: center;
      gap: 8px;
      background: var(--gold-bg);
      border: 1px solid #5a4718;
      color: var(--gold);
      border-radius: 9px;
      padding: 10px 12px;
      font-size: 12px;
      font-weight: 600;
      margin-bottom: 20px;
    }
    body.view-admin .admin-banner { display: flex; }

    /* ── Form fields ── */
    .field + .field { margin-top: 14px; }
    label {
      display: block;
      font-size: 11px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--ink-dim);
      margin-bottom: 6px;
    }
    input {
      width: 100%;
      background: var(--bg2);
      border: 1px solid var(--line);
      border-radius: 8px;
      color: var(--ink);
      font-family: var(--ui);
      font-size: 15px;
      padding: 11px 14px;
      outline: none;
      transition: border-color .15s, box-shadow .15s;
    }
    input::placeholder { color: var(--ink-faint); }
    input:focus {
      border-color: var(--indigo);
      box-shadow: 0 0 0 3px #7c8cf022;
    }
    input[type="date"] { min-height: 44px; }
    input[type="date"]::-webkit-calendar-picker-indicator { filter: invert(.7); cursor: pointer; }
    .hint {
      font-size: 11px;
      color: var(--ink-faint);
      margin-top: 5px;
    }

    /* ── Submit button ── */
    .btn {
      width: 100%;
      margin-top: 22px;
      padding: 13px;
      border: none;
      border-radius: 9px;
      color: #fff;
      font-family: var(--ui);
      font-size: 15px;
      font-weight: 700;
      letter-spacing: .4px;
      cursor: pointer;
      background: var(--indigo);
      transition: background .2s, transform .1s, opacity .15s;
    }
    .btn:hover:not(:disabled) { background: #8d9ef5; }
    .btn:active:not(:disabled) { transform: scale(.98); }
    .btn:disabled { opacity: .5; cursor: not-allowed; }
    body.view-register .btn { background: var(--jade); color: #08130c; }
    body.view-register .btn:hover:not(:disabled) { background: #74d29c; }

    /* ── Status banner ── */
    #status {
      margin-top: 14px;
      max-height: 0; overflow: hidden; opacity: 0;
      font-size: 13px; border-radius: 8px;
      transition: max-height .25s ease, padding .25s ease, opacity .2s;
    }
    #status.show { max-height: 140px; padding: 10px 12px; opacity: 1; }
    #status.info  { background: #1e2133; color: var(--ink-dim);  border: 1px solid var(--line); }
    #status.ok    { background: var(--jade-bg); color: var(--jade); border: 1px solid var(--jade-dim); }
    #status.warn  { background: var(--gold-bg); color: var(--gold); border: 1px solid #5a4718; }
    #status.error { background: var(--verm-bg); color: #f08080;     border: 1px solid var(--verm-dim); }

    /* ── View switching ── */
    #registerForm, #adminForm { display: none; }
    body.view-register #loginForm    { display: none; }
    body.view-register #registerForm { display: block; }
    body.view-admin    #loginForm    { display: none; }
    body.view-admin    #adminForm    { display: block; }

    /* ── Keyboard focus ring ── */
    *:focus-visible {
      outline: 2px solid var(--indigo);
      outline-offset: 2px;
      border-radius: 3px;
    }
    input:focus-visible { outline: none; } /* inputs use box-shadow focus */
    .btn:focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
    .view-btn:focus-visible { outline: 2px solid var(--indigo); outline-offset: -2px; border-radius: 7px; }

    /* ── Spinner ── */
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner {
      display: inline-block; width: 14px; height: 14px;
      border: 2px solid #ffffff44; border-top-color: #fff;
      border-radius: 50%; animation: spin .7s linear infinite;
      vertical-align: middle; margin-right: 7px;
    }

    /* ── Footer ── */
    .foot {
      margin-top: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      color: var(--ink-faint);
      text-align: center;
    }
    .link-btn {
      background: none;
      border: none;
      color: var(--ink-faint);
      font-family: var(--ui);
      font-size: 12px;
      cursor: pointer;
      text-decoration: underline;
      text-underline-offset: 3px;
      padding: 2px 4px;
    }
    .link-btn:hover { color: var(--indigo); }
    #toStudentBtn { display: none; }
    body.view-admin #toStudentBtn { display: inline; }
    body.view-admin .foot .tagline { display: none; }
  
/* ── Build stamp ── */
[data-version-badge]{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;
  gap:6px;font-size:11px;color:var(--ink-faint);line-height:1.6;opacity:0;transition:opacity .3s}
[data-version-badge][data-ready]{opacity:1}
[data-version-badge] .vb-ver{font-weight:700;color:var(--ink-dim);letter-spacing:.4px}
[data-version-badge] .vb-sep{opacity:.5}
[data-version-badge] .vb-note{flex-basis:100%;text-align:center;font-size:10.5px;opacity:.85}
</style>
</head>

<body class="view-login">

<div class="card">

  <div class="logo">
    <div class="kanji" id="logoKanji">日本語</div>
    <div class="sub">Pass Engine</div>
  </div>

  <!-- Sign In / Register toggle -->
  <div class="view-toggle" role="group" aria-label="Sign in or register">
    <button class="view-btn active" data-view="login" type="button" aria-pressed="true">
      <span aria-hidden="true">🔑</span> Sign In
    </button>
    <button class="view-btn" data-view="register" type="button" aria-pressed="false">
      <span aria-hidden="true">✨</span> Register
    </button>
  </div>

  <div class="admin-banner"><span aria-hidden="true">🛡</span> Administrator sign-in</div>

  <!-- ── Student sign-in: name + date of birth ── -->
  <form id="loginForm" autocomplete="off" novalidate>
    <div class="field">
      <label for="loginName">Your Name</label>
      <input id="loginName" type="text" placeholder="e.g. Hari Krishnan"
             autocomplete="name" spellcheck="false" required>
    </div>
    <div class="field">
      <label for="loginDob">Date of Birth</label>
      <input id="loginDob" type="date" autocomplete="bday" required>
    </div>
    <button type="submit" class="btn" id="loginBtn">Sign In</button>
  </form>

  <!-- ── Registration: name + date of birth, active immediately ── -->
  <form id="registerForm" autocomplete="off" novalidate>
    <div class="field">
      <label for="regName">Your Name</label>
      <input id="regName" type="text" placeholder="e.g. Hari Krishnan"
             autocomplete="name" spellcheck="false" required>
      <div class="hint">Use the same name every time you sign in</div>
    </div>
    <div class="field">
      <label for="regDob">Date of Birth</label>
      <input id="regDob" type="date" autocomplete="bday" required>
      <div class="hint">Your name and date of birth are how you sign in</div>
    </div>
    <button type="submit" class="btn" id="registerBtn">Create Account</button>
  </form>

  <!-- ── Admin sign-in: email + password ── -->
  <form id="adminForm" autocomplete="off" novalidate>
    <div class="field">
      <label for="adminEmail">Admin Email</label>
      <input id="adminEmail" type="email" placeholder="admin@example.com"
             autocomplete="username" spellcheck="false" required>
    </div>
    <div class="field">
      <label for="adminPw">Password</label>
      <input id="adminPw" type="password" placeholder="Enter password"
             autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn" id="adminBtn">Sign In</button>
  </form>

  <div id="status" role="alert" aria-live="polite"></div>

  <div class="foot">
    <span class="tagline">Start studying the moment you register.</span>
    <button type="button" class="link-btn" id="toStudentBtn">← Student sign-in</button>
  </div>

  <div data-version-badge aria-live="polite"></div>

</div>

<script type="module">
import { initializeApp }
  from "https://www.gstatic.com/firebasejs/11.9.0/firebase-app.js";
import {
  getFirestore, doc, getDoc, setDoc, updateDoc,
  addDoc, collection, serverTimestamp,
} from "https://www.gstatic.com/firebasejs/11.9.0/firebase-firestore.js";
import {
  getAuth, signInWithEmailAndPassword, createUserWithEmailAndPassword,
  signOut, deleteUser,
} from "https://www.gstatic.com/firebasejs/11.9.0/firebase-auth.js";

const firebaseConfig = {
  apiKey:            "AIzaSyCDfc2n8sJfesrIwbWluTmjTnTsl_x46SQ",
  authDomain:        "japanesen3passengine.firebaseapp.com",
  projectId:         "japanesen3passengine",
  storageBucket:     "japanesen3passengine.firebasestorage.app",
  messagingSenderId: "409024055518",
  appId:             "1:409024055518:web:c1e74cb1cf64e50fc25a4f",
  measurementId:     "G-5KH5JW9JX3"
};

const app  = initializeApp(firebaseConfig);
const db   = getFirestore(app);
const auth = getAuth(app);

// ─── Constants ───────────────────────────────────────────────────────────────
// Students sign in with their name and date of birth. Both are folded into a
// Firebase Auth credential — the username half becomes the email local-part and
// the date-of-birth half becomes the password — so Firebase Auth still does the
// actual verification and nothing credential-shaped is stored in Firestore.
const EMAIL_DOMAIN = "students.japanesen3passengine.app";

// ─── Session checks on load ──────────────────────────────────────────────────
try {
  const a = JSON.parse(sessionStorage.getItem("n3_admin_verified") ?? "null");
  if (a?.verified === true) window.location.replace("admin.html");
} catch { /* ignore */ }
try {
  const u = JSON.parse(sessionStorage.getItem("n3_user_session") ?? "null");
  if (u?.verified === true) window.location.replace("dashboard.html");
} catch { /* ignore */ }

// A date of birth can never be in the future.
const todayISO = new Date().toISOString().slice(0, 10);
document.getElementById("loginDob").max = todayISO;
document.getElementById("regDob").max   = todayISO;

// ─── View switching ──────────────────────────────────────────────────────────
let currentView = "login";
function setView(view) {
  if (view === currentView) return;
  currentView = view;
  document.querySelectorAll(".view-btn").forEach(b => {
    const active = b.dataset.view === view;
    b.classList.toggle("active", active);
    b.setAttribute("aria-pressed", String(active));
  });
  document.body.className = `view-${view}`;
  clearStatus();
  const first = { login: "loginName", register: "regName", admin: "adminEmail" }[view];
  document.getElementById(first)?.focus();
}

document.querySelectorAll(".view-btn").forEach(btn => {
  btn.addEventListener("click", () => setView(btn.dataset.view));
  btn.addEventListener("keydown", e => {
    if (e.key === "ArrowRight" || e.key === "ArrowLeft") {
      e.preventDefault();
      const next = [...document.querySelectorAll(".view-btn")].find(b => b !== btn);
      next?.click(); next?.focus();
    }
  });
});
document.getElementById("toStudentBtn").addEventListener("click", () => setView("login"));

// ─── Hidden admin entrance: tap 日本語 five times ────────────────────────────
// Students never need the admin form, and a visible link only invites poking at
// it. Taps must land inside ADMIN_TAP_WINDOW of each other or the count resets,
// so idle clicking on the logo never drifts into opening it.
const ADMIN_TAP_TARGET = 5;
const ADMIN_TAP_WINDOW = 1500;
let adminTaps = 0;
let adminTapTimer = null;

document.getElementById("logoKanji").addEventListener("click", () => {
  if (currentView === "admin") return;
  clearTimeout(adminTapTimer);
  adminTaps += 1;

  if (adminTaps >= ADMIN_TAP_TARGET) {
    adminTaps = 0;
    setView("admin");
    return;
  }
  adminTapTimer = setTimeout(() => { adminTaps = 0; }, ADMIN_TAP_WINDOW);
});

// ─── UI helpers ──────────────────────────────────────────────────────────────
const statusEl = document.getElementById("status");
function setStatus(type, text) {
  statusEl.className = `show ${type}`;
  statusEl.textContent = text;
}
function clearStatus() {
  statusEl.className = "";
  statusEl.textContent = "";
}
const BTN_LABEL = { loginBtn: "Sign In", registerBtn: "Create Account", adminBtn: "Sign In" };
function setLoading(btn, on, text) {
  btn.disabled = on;
  if (on) {
    const s = document.createElement("span");
    s.className = "spinner";
    btn.textContent = text;
    btn.prepend(s);
  } else {
    btn.textContent = BTN_LABEL[btn.id];
  }
}

// ─── Name + date of birth → Firebase Auth credential ─────────────────────────
// "Hari Krishnan" → "hari_krishnan". Accents are folded and every run of
// non-alphanumerics collapses to a single underscore, so trivial differences in
// spacing or capitalisation still resolve to the same account.
function slugName(name) {
  return name
    .normalize("NFKD")
    .replace(/\p{M}/gu, "")
    .toLowerCase()
    .replace(/[^a-z0-9]+/g, "_")
    .replace(/^_+|_+$/g, "");
}

function credentialsFor(fullName, dob) {
  const username = slugName(fullName);
  return {
    username,
    email:    `${username}@${EMAIL_DOMAIN}`,
    // Deterministic from the two things the student types, and comfortably over
    // the 6-character minimum Firebase Auth enforces.
    password: `${dob}:${username}`,
  };
}

// Returns the trimmed display name, or null if it can't form a valid username.
function readName(inputId) {
  const raw = document.getElementById(inputId).value.trim().replace(/\s+/g, " ");
  if (!raw) return null;
  return /^[a-z0-9_]{2,30}$/.test(slugName(raw)) ? raw : null;
}

function readDob(inputId) {
  const dob = document.getElementById(inputId).value;
  if (!/^\d{4}-\d{2}-\d{2}$/.test(dob)) return null;
  const parsed = new Date(`${dob}T00:00:00Z`);
  if (Number.isNaN(parsed.getTime())) return null;
  if (parsed.getTime() > Date.now()) return null;
  if (Number(dob.slice(0, 4)) < 1900) return null;
  return dob;
}

// ─── Firestore log helper ─────────────────────────────────────────────────────
// Field names and values must match the login_log allowlist in firestore.rules.
async function logAttempt(username, fullName, userType, status) {
  try {
    await addDoc(collection(db, "login_log"), {
      username,
      fullName,
      userType,
      status,
      site:      "n3",
      timestamp: serverTimestamp(),
    });
  } catch (e) { console.warn("[log]", e); }
}

// ─── Admin sign-in ───────────────────────────────────────────────────────────
document.getElementById("adminForm").addEventListener("submit", async e => {
  e.preventDefault();
  clearStatus();

  const email    = document.getElementById("adminEmail").value.trim().toLowerCase();
  const password = document.getElementById("adminPw").value;
  const btn      = document.getElementById("adminBtn");

  if (!email || !password) {
    setStatus("error", "Please enter your email and password.");
    return;
  }

  setLoading(btn, true, "Verifying…");
  try {
    setStatus("info", "Checking credentials…");
    let cred;
    try {
      cred = await signInWithEmailAndPassword(auth, email, password);
    } catch {
      document.getElementById("adminPw").value = "";
      setStatus("error", "Invalid email or password.");
      return;
    }

    const isAdmin = (await getDoc(doc(db, "admins", cred.user.uid))).exists();
    if (!isAdmin) {
      await signOut(auth);
      document.getElementById("adminPw").value = "";
      setStatus("error", "That account is not an administrator.");
      return;
    }

    await logAttempt("admin", "Administrator", "super_admin", "granted");
    sessionStorage.setItem("n3_admin_verified", JSON.stringify({ verified: true, ts: Date.now() }));
    setStatus("ok", "✓ Welcome, Admin! Redirecting to Dashboard…");
    setTimeout(() => window.location.replace("admin.html"), 700);
  } catch (err) {
    console.error("[admin login]", err);
    setStatus("error", `Error: ${err?.message ?? err}`);
  } finally {
    setLoading(btn, false);
  }
});

// ─── Student sign-in ─────────────────────────────────────────────────────────
document.getElementById("loginForm").addEventListener("submit", async e => {
  e.preventDefault();
  clearStatus();

  const btn      = document.getElementById("loginBtn");
  const fullName = readName("loginName");
  const dob      = readDob("loginDob");

  if (!fullName) {
    setStatus("error", "Please enter your name as you registered it.");
    return;
  }
  if (!dob) {
    setStatus("error", "Please pick a valid date of birth.");
    return;
  }

  const { username, email, password } = credentialsFor(fullName, dob);

  setLoading(btn, true, "Signing in…");
  try {
    setStatus("info", "Checking your details…");
    let cred;
    try {
      cred = await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      setStatus("error", err?.code === "auth/too-many-requests"
        ? "Too many attempts — please wait a minute and try again."
        : "No account matches that name and date of birth. Check the spelling, or register first.");
      return;
    }

    // The profile doc is what grants data access. Missing means the admin
    // removed the account.
    const userSnap = await getDoc(doc(db, "users", username));
    if (!userSnap.exists()) {
      await signOut(auth);
      setStatus("error", "This account has been removed. Please contact your teacher.");
      return;
    }

    // A student who has since been promoted signs in exactly as before but
    // belongs in the admin dashboard.
    if ((await getDoc(doc(db, "admins", cred.user.uid))).exists()) {
      await logAttempt(username, userSnap.data().fullName ?? fullName, "super_admin", "granted");
      sessionStorage.setItem("n3_admin_verified", JSON.stringify({ verified: true, ts: Date.now() }));
      setStatus("ok", "✓ Welcome back, Admin! Redirecting…");
      setTimeout(() => window.location.replace("admin.html"), 700);
      return;
    }

    const displayName = userSnap.data().fullName ?? fullName;
    await logAttempt(username, displayName, "user", "granted");
    updateDoc(doc(db, "users", username), { lastLogin: serverTimestamp() }).catch(() => {});

    sessionStorage.setItem("n3_user_session",
      JSON.stringify({ verified: true, username, fullName: displayName, ts: Date.now() }));
    setStatus("ok", `✓ Welcome back, ${displayName}! Redirecting…`);
    setTimeout(() => window.location.replace("dashboard.html"), 700);
  } catch (err) {
    console.error("[login]", err);
    setStatus("error", `Error: ${err?.message ?? err}`);
  } finally {
    setLoading(btn, false);
  }
});

// ─── Registration — no approval step, straight into the app ──────────────────
document.getElementById("registerForm").addEventListener("submit", async e => {
  e.preventDefault();
  clearStatus();

  const btn      = document.getElementById("registerBtn");
  const fullName = readName("regName");
  const dob      = readDob("regDob");

  if (!fullName) {
    setStatus("error", "Please enter your name (at least 2 letters or numbers).");
    return;
  }
  if (!dob) {
    setStatus("error", "Please pick a valid date of birth.");
    return;
  }

  const { username, email, password } = credentialsFor(fullName, dob);

  setLoading(btn, true, "Creating account…");
  try {
    let cred;
    try {
      cred = await createUserWithEmailAndPassword(auth, email, password);
    } catch (err) {
      setStatus("error", err?.code === "auth/email-already-in-use"
        ? "Someone has already registered with that name. Add a middle name or initial to make yours unique."
        : `Could not create the account: ${err?.message ?? err}`);
      return;
    }

    // Profile doc — no credential material, just who they are.
    try {
      await setDoc(doc(db, "users", username), {
        username,
        fullName,
        uid:       cred.user.uid,
        status:    "active",
        createdAt: serverTimestamp(),
        createdBy: "self_registration",
      });
    } catch (err) {
      // Roll the half-made account back so the name stays free for a retry.
      console.error("[register]", err);
      try { await deleteUser(cred.user); } catch { await signOut(auth); }
      setStatus("error", "Could not finish setting up your account. Please try again.");
      return;
    }

    await logAttempt(username, fullName, "user", "registered");

    sessionStorage.setItem("n3_user_session",
      JSON.stringify({ verified: true, username, fullName, ts: Date.now() }));
    document.getElementById("registerForm").reset();
    setStatus("ok", `✓ Welcome, ${fullName}! Taking you to your dashboard…`);
    setTimeout(() => window.location.replace("dashboard.html"), 900);
  } catch (err) {
    console.error("[register]", err);
    setStatus("error", `Error: ${err?.message ?? err}`);
  } finally {
    setLoading(btn, false);
  }
});
</script>
<script src="version-badge.js" defer></script>
</body>
</html>
