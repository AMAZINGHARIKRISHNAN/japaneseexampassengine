name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      # Boots the Firestore emulator, which compiles firestore.rules —
      # fails the build on any rules syntax error.
      - name: Validate Firestore rules
        run: |
          npm install -g firebase-tools
          firebase emulators:exec --only firestore --project demo-ci "echo rules compiled OK"

      # Parses every inline <script> so a syntax error fails the build rather
      # than the page. Classic scripts and modules use different parse goals.
      - name: Parse inline page scripts
        run: node .github/scripts/check-scripts.mjs public

      # Fails if any previously-fixed security hole sneaks back in.
      - name: Guard against known security regressions
        run: |
          set -e
          fail() { echo "::error::$1"; exit 1; }

          if grep -RIn --include='*.html' -E 'ADMIN_PASS\s*=' .; then
            fail 'Hardcoded admin password found in an HTML page'
          fi

          # Any collection readable or writable by anyone at all.
          if grep -nE 'allow (read|write|create|update|delete)[^:]*: *if true' firestore.rules; then
            fail 'Wide-open Firestore rule found — every rule needs an auth check'
          fi

          # The admin dashboard renders Firestore strings while signed in as the
          # admin, so unescaped interpolation there is account takeover.
          if ! grep -q 'function esc(' public/admin.html; then
            fail 'admin.html lost its esc() HTML-escaping helper'
          fi
          if grep -nE 'onclick="[a-zA-Z]+\(.\$\{' public/admin.html; then
            fail 'Firestore value interpolated into an inline onclick in admin.html'
          fi

          # Credentials belong in Firebase Auth, never in a profile doc.
          if grep -RIn --include='*.html' -E '(password|dob):\s*(fullName|dob|username)' public/ | grep -v 'passwordFor'; then
            fail 'A credential-shaped field looks like it is being written to Firestore'
          fi

          # The countdown froze at zero once its hardcoded date passed. The date
          # must come from the student, never from a literal in the source.
          if grep -RIn --include='*.html' -E 'EXAM_DATE\s*=\s*new Date\("[0-9]{4}-' public/; then
            fail 'Hardcoded EXAM_DATE reintroduced — it will silently expire'
          fi

          # The name-slug derivation is duplicated in three places by necessity
          # (browser login, admin page, Admin SDK script). If one copy vanishes
          # or drifts, admin-created accounts stop matching what students type.
          for f in public/login.html public/admin.html scripts/manage-auth.mjs; do
            grep -q 'normalize("NFKD")' "$f" || fail "$f lost its slugName() derivation"
            grep -q '\[^a-z0-9\]+/g, "_"' "$f" || fail "$f slugName() derivation drifted"
          done

          echo "No known security regressions."
